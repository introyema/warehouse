<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сховище — каталог українізаторів і модів</title>
  <meta name="description" content="Персональний каталог модів, українізаторів та власних проєктів для відеоігор українською мовою.">
  <meta name="theme-color" content="#0f1220">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="uk_UA">
  <meta property="og:title" content="Сховище — каталог українізаторів і модів">
  <meta property="og:description" content="Моди, українізатори та власні проєкти для ігор.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%236c5ce7'/%3E%3Ctext x='50' y='68' font-size='56' text-anchor='middle' fill='white' font-family='sans-serif'%3EС%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Перейти до змісту</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="#/" id="brand-link"><span class="brand-mark" aria-hidden="true">С</span><span id="site-title">Сховище</span></a>
      <nav aria-label="Основна навігація" class="nav">
        <a href="#/">Головна</a>
        <a href="#/catalog" id="nav-catalog">Усі проєкти</a>
        <a href="#/about" id="nav-about">Про автора</a>
        <a href="#" class="nav-github" id="header-github" target="_blank" rel="noopener" hidden>GitHub</a>
      </nav>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <section class="hero" id="hero">
      <div class="container">
        <p class="eyebrow">Українізатори · Моди · Інструменти</p>
        <h1 id="hero-title">Сховище</h1>
        <p class="hero-text" id="hero-text"></p>
        <div class="hero-actions">
          <a class="btn btn-primary" href="#/catalog" id="hero-catalog">Переглянути проєкти</a>
          <a class="btn btn-ghost" href="#" id="hero-github" target="_blank" rel="noopener" hidden>Мій GitHub</a>
        </div>
      </div>
    </section>

    <section class="section" id="catalog" aria-labelledby="catalog-title">
      <div class="container">
        <h2 id="catalog-title">Каталог проєктів</h2>
        <div class="toolbar">
          <div class="search">
            <label for="search">Пошук за назвою або описом</label>
            <input type="search" id="search" placeholder="Наприклад: Witcher" autocomplete="off">
          </div>
          <div class="filters" role="group" aria-label="Фільтр за категорією" id="filters"></div>
        </div>
        <p class="result-count" id="result-count" aria-live="polite"></p>
        <div class="grid" id="grid"></div>
        <p class="empty" id="empty" hidden>Нічого не знайдено. Спробуйте змінити запит або обрати іншу категорію.</p>
      </div>
    </section>

    <section class="section section-alt" id="about" aria-labelledby="about-title">
      <div class="container narrow">
        <h2 id="about-title">Про автора</h2>
        <div id="about-text"></div>
      </div>
    </section>

    <section class="section" id="detail" aria-live="polite" hidden></section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>© <span id="year"></span> <span id="footer-title"></span></p>
      <p><a href="#" id="footer-github" target="_blank" rel="noopener" hidden>GitHub</a></p>
      <p class="footer-note" id="footer-note"></p>
    </div>
  </footer>

  <dialog id="lightbox" class="lightbox" aria-label="Перегляд скриншота">
    <figure>
      <img id="lightbox-img" src="" alt="">
      <figcaption id="lightbox-caption"></figcaption>
    </figure>
    <div class="lightbox-bar">
      <button type="button" class="btn btn-ghost btn-sm" id="lb-prev">← Попередній</button>
      <span id="lb-count" aria-live="polite"></span>
      <button type="button" class="btn btn-ghost btn-sm" id="lb-next">Наступний →</button>
      <button type="button" class="btn btn-primary btn-sm" id="lb-close">Закрити</button>
    </div>
  </dialog>

  <script src="data/site.js"></script>
  <script src="data/projects.js"></script>
  <script src="data/supabase-config.js"></script>
  <script src="js/view.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
